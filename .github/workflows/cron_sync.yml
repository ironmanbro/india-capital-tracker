name: Sync NSE and NSDL data

on:
  schedule:
    - cron: "0 2 * * *"      # 7:30 am IST: everything, including the previous day's deals as a safety net
    - cron: "30 12 * * 1-5"  # 6:00 pm IST on trading days: NSE bulk and block deals are out after the close
    - cron: "30 15 * * 1-5"  # 9:00 pm IST: second try, because the deals file only ever holds the latest day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/collectors/requirements.txt openpyxl
      - name: Collect
        id: collect
        # Do not stop here: whatever was collected is still loaded below. The last step turns the run red if a collector failed
        # unexpectedly, so GitHub emails the owner instead of the failure hiding behind a green tick (Milestone 0 finding).
        continue-on-error: true
        working-directory: pipeline/collectors
        env:
          # BSE answers GitHub's servers with HTTP 403; its deals arrive from the owner's own computer (pipeline/push_bse.py).
          ICT_ACCEPTED_FAILURES: "bse_deals.py"
          SEC_USER_AGENT: "IndianCapitalTracker kishansinghania18@gmail.com"
        run: python run_all.py
      - name: Load into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python pipeline/load_feeds.py pipeline/collectors/data
      - name: Enrich investor profiles (Wikidata)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python pipeline/enrich_profiles.py
      - name: Fail the run if a collector failed unexpectedly
        if: steps.collect.outcome == 'failure'
        run: |
          echo "A collector failed (see the Collect step). Data that did load was still saved."
          exit 1
