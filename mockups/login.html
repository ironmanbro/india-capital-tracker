<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup: India Capital Tracker login</title>
<style>
:root{--bg:#000;--panel:#0c0c0e;--panel2:#141418;--ink:#f5f5f7;--muted:#8e8e93;--line:rgba(255,255,255,.1);--chip:rgba(255,255,255,.07);--accent:#4d8dff;--accent2:#6f95ff;--in:#30d158;--out:#ff453a}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#0a0b0e;color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.ctl{position:sticky;top:0;z-index:50;background:rgba(10,11,14,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ctl b{font-size:13px}.ctl small{color:var(--muted);font-size:12px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:600;padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--chip);color:var(--ink)}
.stage{display:flex;justify-content:center;padding:22px 14px 50px}
.device{width:100%;max-width:1080px;background:var(--bg);border:1px solid var(--line);border-radius:18px;overflow:hidden;min-height:640px;display:grid;grid-template-columns:1.05fr 1fr}
.device.phone{max-width:390px;grid-template-columns:1fr;border:8px solid #1c1d22;border-radius:38px;min-height:760px}
/* brand side */
.brand{position:relative;padding:44px 40px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(900px 500px at 0% 0%,rgba(77,141,255,.28),transparent 60%),radial-gradient(700px 420px at 100% 100%,rgba(111,149,255,.16),transparent 60%),#05060a;border-right:1px solid var(--line)}
.device.phone .brand{display:none}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#5a82f0,#3b5bd6);display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff}
.brand h2{font-size:34px;line-height:1.1;letter-spacing:-.02em;margin:0 0 12px;max-width:380px}
.brand p{color:var(--muted);margin:0;max-width:380px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:19px}.stat small{color:var(--muted);font-size:11px}
/* form side */
.formside{padding:44px 40px;display:flex;align-items:center;justify-content:center}
.device.phone .formside{padding:56px 22px 30px;align-items:flex-start}
.card{width:100%;max-width:360px}
.device.phone .mlogo{display:flex}
.mlogo{display:none;margin-bottom:26px}
h1{font-size:26px;letter-spacing:-.02em;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 22px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.field{position:relative}
input[type=text],input[type=email],input[type=password]{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;font-size:16px;outline:none;min-height:48px;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(77,141,255,.25)}
input.bad{border-color:var(--out);box-shadow:0 0 0 3px rgba(255,69,58,.18)}
.err{color:var(--out);font-size:12px;margin-top:6px;min-height:0}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:10px;font-size:13px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 4px;font-size:13px}
.chk{display:flex;gap:8px;align-items:center;color:var(--muted);cursor:pointer}
.chk input{accent-color:var(--accent);width:18px;height:18px}
a.lnk,button.lnk{color:var(--accent2);background:none;border:0;font:inherit;cursor:pointer;padding:0;text-decoration:none;font-weight:600}
.btn{width:100%;min-height:48px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .1s,filter .15s}
.btn:active{transform:scale(.98)}.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--ink);margin-top:10px;font-weight:600}
.btn[disabled]{opacity:.7;cursor:progress}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:18px 0 6px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.foot{margin-top:22px;text-align:center;color:var(--muted);font-size:13px}
.small{color:var(--muted);font-size:11.5px;margin-top:18px;text-align:center}
.meter{display:flex;gap:4px;margin-top:8px}.meter i{flex:1;height:4px;border-radius:2px;background:var(--chip)}
.otp{display:flex;gap:8px;margin:6px 0}
.otp input{text-align:center;padding:0;font-size:22px;font-weight:700;width:100%;height:54px}
.note{background:rgba(77,141,255,.1);border:1px solid rgba(77,141,255,.3);border-radius:12px;padding:10px 12px;font-size:13px;color:#cfe0ff;margin-bottom:6px}
.ok{width:64px;height:64px;border-radius:50%;background:rgba(48,209,88,.15);border:1px solid rgba(48,209,88,.5);display:grid;place-items:center;font-size:30px;color:var(--in);margin:0 0 18px}
.perk{display:grid;gap:8px;margin:14px 0 0;padding:0;list-style:none}.perk li{display:flex;gap:9px;color:var(--muted);font-size:13px}.perk li::before{content:"✓";color:var(--in);font-weight:800}
.mock{display:inline-block;font-size:10px;color:#ffb340;border:1px solid #ffb34066;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
@media(max-width:820px){.device:not(.phone){grid-template-columns:1fr}.device:not(.phone) .brand{display:none}.device:not(.phone) .mlogo{display:flex}}
</style>
</head>
<body>
<div class="ctl">
  <div><b>Login page mockup</b><span class="mock">NO REAL SIGN-IN</span><br><small>Every button is for show; nothing is sent or stored.</small></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <div class="seg" id="screens"></div>
    <div class="seg" id="devs"><button data-d="lap" class="on">Laptop</button><button data-d="phone">Phone</button></div>
  </div>
</div>
<div class="stage"><div class="device" id="dev"></div></div>

<script>
const SCREENS=[["signin","Sign in"],["signup","Create account"],["otp","One-time code"],["forgot","Forgot password"],["done","Signed in"]];
let screen="signin",dev="lap";
const $=(s,r=document)=>r.querySelector(s);
const brand=`<div class="brand">
  <div class="logo"><i>ICT</i> India Capital Tracker</div>
  <div><h2>Follow foreign money in and out of India.</h2><p>Investments, exits, FPI flows and fund launches in one place. Sign in to save firms, set alerts and download data.</p></div>
  <div class="stats"><div class="stat"><b>12,300+</b><small>FPIs registered</small></div><div class="stat"><b>8,200+</b><small>stories tracked</small></div><div class="stat"><b>Daily</b><small>NSE and NSDL data</small></div></div>
</div>`;
const mlogo=`<div class="logo mlogo"><i>ICT</i> India Capital Tracker</div>`;
const google=`<svg width="18" height="18" viewBox="0 0 24 24"><path fill="#fff" d="M21.35 11.1H12v2.9h5.35c-.5 2.4-2.5 3.6-5.35 3.6a6 6 0 1 1 0-12c1.5 0 2.8.5 3.8 1.4l2.1-2.1A9 9 0 1 0 12 21c5 0 9.2-3.5 9.2-9 0-.3 0-.6-.1-.9z"/></svg>`;
const apple=`<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M16.4 12.7c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.800-1.800-3.400-1.800-1.400-.1-2.800.8-3.500.8s-1.800-.8-3-.8C6.900 7.400 5.500 8.300 4.700 9.700c-1.600 2.800-.4 6.900 1.200 9.200.8 1.100 1.700 2.400 2.900 2.300 1.200 0 1.600-.7 3-.7s1.800.7 3 .7 2-1.100 2.800-2.200c.9-1.300 1.200-2.500 1.300-2.600-.1 0-2.500-1-2.500-3.700zM14.100 5.800c.6-.8 1.100-1.800.9-2.900-.9 0-2 .6-2.700 1.400-.6.7-1.100 1.800-1 2.800 1.100.1 2.100-.5 2.800-1.300z"/></svg>`;
const eye=`<button type="button" class="eye" data-eye aria-label="Show password">Show</button>`;

const FORMS={
signin:()=>`${mlogo}<h1>Welcome back</h1><p class="sub">Sign in to your account.</p>
 <form novalidate data-go="done">
  <label for="em">Email</label><input id="em" type="email" placeholder="you@company.com" autocomplete="email"><div class="err" data-e="em"></div>
  <label for="pw">Password</label><div class="field"><input id="pw" type="password" placeholder="Your password" autocomplete="current-password">${eye}</div><div class="err" data-e="pw"></div>
  <div class="row"><label class="chk" style="margin:0"><input type="checkbox" checked> Keep me signed in</label><button type="button" class="lnk" data-s="forgot">Forgot password?</button></div>
  <button class="btn" type="submit">Sign in</button>
 </form>
 <div class="or">or continue with</div>
 <button class="btn ghost" type="button">${google} Google</button>
 <button class="btn ghost" type="button">${apple} Apple</button>
 <button class="btn ghost" type="button" data-s="otp">✉︎ Email me a one-time code</button>
 <div class="foot">New here? <button class="lnk" data-s="signup">Create an account</button></div>
 <div class="foot" style="margin-top:8px"><button class="lnk" data-s="done" style="color:var(--muted);font-weight:500">Continue without signing in →</button></div>`,
signup:()=>`${mlogo}<h1>Create your account</h1><p class="sub">Free. Takes under a minute.</p>
 <form novalidate data-go="otp">
  <label for="nm">Full name</label><input id="nm" type="text" placeholder="Priya Sharma" autocomplete="name"><div class="err" data-e="nm"></div>
  <label for="em">Work email</label><input id="em" type="email" placeholder="you@company.com" autocomplete="email"><div class="err" data-e="em"></div>
  <label for="pw">Password</label><div class="field"><input id="pw" type="password" placeholder="At least 10 characters" autocomplete="new-password">${eye}</div>
  <div class="meter" id="meter"><i></i><i></i><i></i><i></i></div><div class="sub" id="mtxt" style="margin:6px 0 0;font-size:12px">Use 10+ characters with a mix of letters and numbers.</div><div class="err" data-e="pw"></div>
  <label class="chk" style="margin:16px 0 0"><input type="checkbox" id="tos"> <span>I agree to the <a class="lnk" href="#" onclick="return false">terms</a> and <a class="lnk" href="#" onclick="return false">privacy policy</a></span></label><div class="err" data-e="tos"></div>
  <button class="btn" type="submit">Create account</button>
 </form>
 <ul class="perk"><li>Save the firms and filters you follow</li><li>Get an email when a followed firm has a new deal</li><li>Download tables as CSV</li></ul>
 <div class="foot">Already have an account? <button class="lnk" data-s="signin">Sign in</button></div>`,
otp:()=>`${mlogo}<h1>Check your email</h1><p class="sub">We sent a 6-digit code to <b style="color:var(--ink)">priya@company.com</b>. It expires in 10 minutes.</p>
 <form novalidate data-go="done"><div class="otp" id="otp">${[0,1,2,3,4,5].map(i=>`<input type="text" inputmode="numeric" maxlength="1" aria-label="Digit ${i+1}" autocomplete="${i?'off':'one-time-code'}">`).join("")}</div><div class="err" data-e="otp"></div>
 <button class="btn" type="submit">Verify and continue</button></form>
 <div class="foot">Didn't get it? <button class="lnk" id="resend">Resend code</button> <span id="cd" style="color:var(--muted)"></span></div>
 <div class="foot" style="margin-top:8px"><button class="lnk" data-s="signin" style="color:var(--muted);font-weight:500">← Use a different method</button></div>`,
forgot:()=>`${mlogo}<h1>Reset your password</h1><p class="sub">Enter your email and we'll send a link to choose a new one.</p>
 <form novalidate data-go="forgot-sent"><label for="em">Email</label><input id="em" type="email" placeholder="you@company.com" autocomplete="email"><div class="err" data-e="em"></div>
 <button class="btn" type="submit">Send reset link</button></form>
 <div class="foot"><button class="lnk" data-s="signin">← Back to sign in</button></div>`,
"forgot-sent":()=>`${mlogo}<div class="ok">✉︎</div><h1>Reset link sent</h1><p class="sub">If an account exists for that email, a link is on its way. It works once and expires in 30 minutes.</p>
 <button class="btn" data-s="signin">Back to sign in</button><div class="foot">Wrong email? <button class="lnk" data-s="forgot">Try again</button></div>`,
done:()=>`${mlogo}<div class="ok">✓</div><h1>You're signed in</h1><p class="sub">Welcome, Priya. Your followed firms and saved filters are ready.</p>
 <div class="note">Next, the real page would open the Home tab with your name shown in the top right.</div>
 <button class="btn" type="button">Open the dashboard →</button><button class="btn ghost" data-s="signin">Sign out (back to sign in)</button>`
};

function draw(){
 $("#screens").innerHTML=SCREENS.map(([k,t])=>`<button data-k="${k}" class="${screen===k||(screen==="forgot-sent"&&k==="forgot")?"on":""}">${t}</button>`).join("");
 $("#devs").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.d===dev));
 const d=$("#dev");d.className="device"+(dev==="phone"?" phone":"");
 d.innerHTML=brand+`<div class="formside"><div class="card">${FORMS[screen]()}</div></div>`;
 wire();
}
function setErr(f,k,msg){const e=f.querySelector(`[data-e="${k}"]`);if(e)e.textContent=msg||"";const i=f.querySelector("#"+k);if(i)i.classList.toggle("bad",!!msg)}
function wire(){
 document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{screen=b.dataset.s;draw()});
 document.querySelectorAll("[data-eye]").forEach(b=>b.onclick=()=>{const i=b.parentElement.querySelector("input");const show=i.type==="password";i.type=show?"text":"password";b.textContent=show?"Hide":"Show"});
 const pw=$("#pw"),meter=$("#meter");
 if(pw&&meter)pw.oninput=()=>{const v=pw.value;let sc=0;if(v.length>=10)sc++;if(/[a-z]/.test(v)&&/[A-Z]/.test(v))sc++;if(/\d/.test(v))sc++;if(/[^A-Za-z0-9]/.test(v)||v.length>=14)sc++;
  meter.querySelectorAll("i").forEach((x,i)=>x.style.background=i<sc?["#ff453a","#ff9f0a","#ffd60a","#30d158"][sc-1]:"");
  $("#mtxt").textContent=!v?"Use 10+ characters with a mix of letters and numbers.":["Too weak","Getting there","Good","Strong"][Math.max(0,sc-1)]};
 const otp=$("#otp");
 if(otp){const ins=[...otp.querySelectorAll("input")];ins[0].focus();
  ins.forEach((el,i)=>{el.oninput=()=>{el.value=el.value.replace(/\D/g,"");if(el.value&&ins[i+1])ins[i+1].focus()};
   el.onkeydown=(e)=>{if(e.key==="Backspace"&&!el.value&&ins[i-1])ins[i-1].focus()};
   el.onpaste=(e)=>{const t=(e.clipboardData.getData("text")||"").replace(/\D/g,"").slice(0,6);if(t){e.preventDefault();t.split("").forEach((c,j)=>ins[j]&&(ins[j].value=c));ins[Math.min(t.length,5)].focus()}}});
  let n=30;const cd=$("#cd"),rs=$("#resend");rs.disabled=true;rs.style.opacity=.5;const tm=setInterval(()=>{if(!cd||!cd.isConnected){clearInterval(tm);return}n--;cd.textContent=n>0?`in ${n}s`:"";if(n<=0){rs.disabled=false;rs.style.opacity=1;clearInterval(tm)}},1000);cd.textContent=`in ${n}s`;}
 const f=document.querySelector("form");
 if(f)f.onsubmit=(e)=>{e.preventDefault();let bad=false;
  const em=f.querySelector("#em"),pww=f.querySelector("#pw"),nm=f.querySelector("#nm"),tos=f.querySelector("#tos");
  if(em){const ok=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em.value);setErr(f,"em",ok?"":(em.value?"That email doesn't look right.":"Enter your email."));bad=bad||!ok}
  if(nm){const ok=nm.value.trim().length>1;setErr(f,"nm",ok?"":"Enter your name.");bad=bad||!ok}
  if(pww){const need=screen==="signup"?10:1,ok=pww.value.length>=need;setErr(f,"pw",ok?"":(screen==="signup"?"Use at least 10 characters.":"Enter your password."));bad=bad||!ok}
  if(tos){setErr(f,"tos",tos.checked?"":"Please accept to continue.");bad=bad||!tos.checked}
  if(otp){const v=[...otp.querySelectorAll("input")].map(x=>x.value).join("");const ok=v.length===6;setErr(f,"otp",ok?"":"Enter all 6 digits.");bad=bad||!ok}
  if(bad)return;
  const btn=f.querySelector(".btn");btn.disabled=true;btn.innerHTML='<span class="spin"></span> Please wait…';
  setTimeout(()=>{screen=f.dataset.go;draw()},900)};
}
$("#screens").onclick=(e)=>{const b=e.target.closest("button");if(b){screen=b.dataset.k;draw()}};
$("#devs").onclick=(e)=>{const b=e.target.closest("button");if(b){dev=b.dataset.d;draw()}};
draw();
</script>
</body>
</html>
