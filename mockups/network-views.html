<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup: Network tab, four alternatives to the constellation</title>
<style>
:root{--bg:#000;--panel:#0c0c0e;--panel2:#16171c;--ink:#f5f5f7;--muted:#8e8e93;--line:rgba(255,255,255,.1);--chip:rgba(255,255,255,.07);--accent:#6f95ff;--in:#2a9bff;--out:#ff9f0a}
*{box-sizing:border-box}
body{margin:0;background:#111216;color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.page{max-width:1040px;margin:0 auto;padding:20px 16px 50px}
h1{font-size:18px;margin:0 0 4px}.lead{color:var(--muted);margin:0 0 14px}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
@media(max-width:760px){.opts{grid-template-columns:1fr 1fr}}
.opt{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.opt b{display:block;font-size:13px}.opt small{color:var(--muted);font-size:11px}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.stage{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:16px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.bar h2{margin:0;font-size:16px}.sub{color:var(--muted);font-size:12px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:600;padding:5px 11px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--chip);color:var(--ink)}
svg{display:block;width:100%}
.note{margin-top:12px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:10px}
.rank{display:grid;grid-template-columns:26px minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer}
.rank:hover{background:var(--chip)}
.rank .n{color:var(--muted);font-weight:700}.rank .bar2{height:7px;border-radius:4px;background:var(--chip);overflow:hidden}.rank .bar2 i{display:block;height:100%;background:var(--accent)}
.rank .go{color:var(--accent);font-size:12px;font-weight:600;white-space:nowrap}
.tag{font-size:11px;color:var(--muted);background:var(--chip);border-radius:6px;padding:1px 7px;margin-right:4px}
.hm{display:grid;gap:3px;overflow-x:auto}
.hm .c{border-radius:6px;min-height:34px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.hm .h{color:var(--muted);font-size:11px;font-weight:600;text-align:center;align-self:end;padding-bottom:3px}
.hm .r{font-size:12px;font-weight:600;display:flex;align-items:center;white-space:nowrap}
.mock{display:inline-block;font-size:10px;color:#ffb340;border:1px solid #ffb34066;border-radius:6px;padding:1px 6px;margin-left:8px;vertical-align:middle}
</style>
</head>
<body>
<div class="page">
  <h1>Network tab: four alternatives to the constellation <span class="mock">MOCK DATA</span></h1>
  <p class="lead">Pick an option below to see how the tab would look. Each is interactive.</p>
  <div class="opts" id="opts"></div>
  <div class="stage" id="stage"></div>
</div>

<script>
/* ---------- mock data, seeded so it is the same on every load ---------- */
function rng(seed){return()=>{seed|=0;seed=(seed+0x6d2b79f5)|0;let t=Math.imul(seed^(seed>>>15),1|seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
const R=rng(77),pick=(a)=>a[Math.floor(R()*a.length)];
const INV=[["Temasek","Singapore"],["GIC","Singapore"],["ADIA","UAE"],["Norges Bank IM","Norway"],["Brookfield","Canada"],["CPP Investments","Canada"],["KKR","USA"],["Blackstone","USA"],["General Atlantic","USA"],["BlackRock","USA"],["Vanguard","USA"],["Sumitomo Mitsui","Japan"]];
const CO=[["HDFC Bank","Financial services"],["Bajaj Finance","Financial services"],["Reliance Retail","Consumer"],["Zomato","Technology"],["Swiggy","Technology"],["Adani Ports","Infrastructure"],["Embassy REIT","Real estate"],["Apollo Hospitals","Healthcare"],["Tata Power","Energy"],["Larsen & Toubro","Industrials"]];
const SEC=[...new Set(CO.map(c=>c[1]))];
const DEALS=Array.from({length:70},()=>{const i=pick(INV),c=pick(CO);return{inv:i[0],country:i[1],co:c[0],sec:c[1],amt:Math.round(20+R()**2*1300)}});
const usd=(m)=>m>=1000?`$${(m/1000).toFixed(2)}bn`:`$${Math.round(m)}m`;
const sum=(f)=>{const m={};DEALS.forEach(d=>{const k=f(d);m[k]=(m[k]||0)+d.amt});return m};
const $=(s,r=document)=>r.querySelector(s);
const esc=(s)=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const OPTS=[
 ["flow","Capital flow diagram","Country → investor → sector → company"],
 ["rank","Most-connected ranking","A leaderboard; tap a firm for its profile"],
 ["heat","Investor × sector heatmap","Who is concentrated where"],
 ["net","Clean network of top firms","Flat, labelled graph of the 30 most linked"],
];
let cur="flow";
function drawOpts(){$("#opts").innerHTML=OPTS.map(([k,t,s],i)=>`<button class="opt ${k===cur?"on":""}" data-k="${k}"><b>${i+1}. ${t}</b><small>${s}</small></button>`).join("");
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{cur=b.dataset.k;draw()})}

/* ---------- 1. capital flow ---------- */
function flow(){
 const tally=(f)=>Object.entries(sum(f)).sort((a,b)=>b[1]-a[1]);
 const cols=[["Capital source","country",tally(d=>d.country).slice(0,5)],["Lead investor","inv",tally(d=>d.inv).slice(0,7)],["Sector","sec",tally(d=>d.sec).slice(0,6)],["Company","co",tally(d=>d.co).slice(0,8)]];
 const W=900,H=420,X=[80,310,560,810],pos={};
 cols.forEach(([,k,items],ci)=>items.forEach(([n],i)=>pos[k+":"+n]={x:X[ci],y:46+i*((H-70)/Math.max(1,items.length-1))}));
 const E={};DEALS.forEach(d=>[["country:"+d.country,"inv:"+d.inv],["inv:"+d.inv,"sec:"+d.sec],["sec:"+d.sec,"co:"+d.co]].forEach(([a,b])=>{if(pos[a]&&pos[b]){const k=a+"|"+b;E[k]=(E[k]||0)+d.amt}}));
 const ev=Object.entries(E),mx=Math.max(...ev.map(e=>e[1]));
 let focus=null;
 const el=document.createElement("div");
 const paint=()=>{const ok=(id)=>!focus||id===focus||ev.some(([k])=>{const[a,b]=k.split("|");return(a===focus&&b===id)||(b===focus&&a===id)});
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}">`+cols.map(([t],i)=>`<text x="${X[i]}" y="16" fill="#8e8e93" font-size="11" font-weight="700" text-anchor="middle" letter-spacing=".08em">${t.toUpperCase()}</text>`).join("")+
  ev.map(([k,v])=>{const[a,b]=k.split("|"),p=pos[a],q=pos[b],on=!focus||a===focus||b===focus;return`<path d="M${p.x+6},${p.y} C${(p.x+q.x)/2},${p.y} ${(p.x+q.x)/2},${q.y} ${q.x-6},${q.y}" fill="none" stroke="#6f95ff" stroke-opacity="${on?.5:.06}" stroke-width="${1+v/mx*8}"/>`}).join("")+
  cols.map(([,k,items])=>items.map(([n,v])=>{const id=k+":"+n,p=pos[id];return`<g data-id="${id}" style="cursor:pointer" opacity="${ok(id)?1:.25}"><circle cx="${p.x}" cy="${p.y}" r="${5+v/mx*3}" fill="${focus===id?"#fff":"#2a9bff"}" stroke="#000" stroke-width="2"/><text x="${p.x}" y="${p.y-11}" fill="#f5f5f7" font-size="11" font-weight="600" text-anchor="middle">${esc(n)}</text><title>${esc(n)}: ${usd(v)}</title></g>`}).join("")).join("")+"</svg>";
  el.querySelectorAll("g[data-id]").forEach(g=>g.onclick=()=>{focus=focus===g.dataset.id?null:g.dataset.id;paint()})};
 paint();
 return{title:"Capital flow",sub:"Where the money comes from and ends up. Line width = deal value. Click a node to isolate its links.",body:el,note:"Best for: seeing the route from a country to a company. Works on a phone by scrolling sideways or turning it landscape."};
}

/* ---------- 2. ranking ---------- */
function rank(){
 const by={};DEALS.forEach(d=>{const o=by[d.inv]||(by[d.inv]={n:d.inv,c:d.country,co:new Set(),sec:new Set(),v:0,deals:0});o.co.add(d.co);o.sec.add(d.sec);o.v+=d.amt;o.deals++});
 const rows=Object.values(by).sort((a,b)=>b.co.size-a.co.size||b.v-a.v),mx=Math.max(...rows.map(r=>r.co.size));
 const el=document.createElement("div");
 el.innerHTML=`<div class="sub" style="margin-bottom:6px">Ranked by how many different companies each firm has deals with.</div>`+rows.map((r,i)=>`<div class="rank"><div class="n">${i+1}</div><div><b>${esc(r.n)}</b> <span class="sub">${esc(r.c)}</span><div style="margin-top:3px">${[...r.sec].slice(0,3).map(s=>`<span class="tag">${esc(s)}</span>`).join("")}</div></div><div><div class="sub">${r.co.size} compan${r.co.size===1?"y":"ies"} · ${r.deals} deal${r.deals===1?"":"s"}</div><div class="bar2"><i style="width:${r.co.size/mx*100}%"></i></div></div><div style="text-align:right"><b>${usd(r.v)}</b><div class="go">Open profile →</div></div></div>`).join("");
 return{title:"Most-connected firms",sub:"A simple leaderboard, most linked first.",body:el,note:"Best for: speed and phones. No picture to learn; every row opens the firm's profile page."};
}

/* ---------- 3. heatmap ---------- */
function heat(){
 const invs=Object.entries(sum(d=>d.inv)).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
 const cell={};DEALS.forEach(d=>{const k=d.inv+"|"+d.sec;cell[k]=(cell[k]||0)+d.amt});
 const mx=Math.max(...Object.values(cell));
 const el=document.createElement("div");el.className="hm";el.style.gridTemplateColumns=`150px repeat(${SEC.length},minmax(70px,1fr))`;
 let h=`<div></div>`+SEC.map(s=>`<div class="h">${esc(s)}</div>`).join("");
 invs.forEach(i=>{h+=`<div class="r">${esc(i)}</div>`+SEC.map(s=>{const v=cell[i+"|"+s]||0,a=.12+.88*(v/mx);return`<div class="c" title="${esc(i)} · ${esc(s)}: ${usd(v)}" style="background:${v?`rgba(42,155,255,${a.toFixed(2)})`:"var(--chip)"};color:${a>.55?"#fff":"#c7c7cc"}">${v?usd(v):""}</div>`}).join("");});
 el.innerHTML=h;
 return{title:"Investor × sector",sub:"Darker = more deal value. Hover a cell for the exact figure.",body:el,note:"Best for: spotting concentration, such as which firms back which sector. Compares many firms at once."};
}

/* ---------- 4. clean 2D network ---------- */
function net(){
 const nodes=[],idx={};
 const add=(id,label,kind,size)=>{if(idx[id]==null){idx[id]=nodes.length;nodes.push({id,label,kind,size:0,x:0,y:0,vx:0,vy:0})}nodes[idx[id]].size+=size;return nodes[idx[id]]};
 DEALS.forEach(d=>{add("i:"+d.inv,d.inv,"inv",d.amt);add("c:"+d.co,d.co,"co",d.amt);add("s:"+d.sec,d.sec,"sec",d.amt)});
 const E={};DEALS.forEach(d=>{[["i:"+d.inv,"c:"+d.co],["c:"+d.co,"s:"+d.sec]].forEach(([a,b])=>{const k=a+"|"+b;E[k]=(E[k]||0)+d.amt})});
 const edges=Object.entries(E).map(([k,v])=>{const[a,b]=k.split("|");return{a:idx[a],b:idx[b],v}});
 const W=900,H=480,r2=rng(5);nodes.forEach((n,i)=>{const t=i/nodes.length*6.283;n.x=W/2+Math.cos(t)*200+r2()*20;n.y=H/2+Math.sin(t)*160+r2()*20});
 // Fruchterman-Reingold layout: nodes push apart, linked nodes pull together, and the movement cools over time.
 const k=0.62*Math.sqrt(W*H/nodes.length);
 for(let it=0;it<300;it++){
  const t=W*0.1*(1-it/300)+1;nodes.forEach(n=>{n.dx=0;n.dy=0});
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j];let dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy)||.01,f=k*k/d;dx/=d;dy/=d;a.dx+=dx*f;a.dy+=dy*f;b.dx-=dx*f;b.dy-=dy*f}
  for(const e of edges){const a=nodes[e.a],b=nodes[e.b];let dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy)||.01,f=d*d/k;dx/=d;dy/=d;a.dx-=dx*f;a.dy-=dy*f;b.dx+=dx*f;b.dy+=dy*f}
  for(const n of nodes){n.dx+=(W/2-n.x)*.05;n.dy+=(H/2-n.y)*.05;const len=Math.sqrt(n.dx*n.dx+n.dy*n.dy)||.01,m=Math.min(len,t);n.x=Math.min(W-70,Math.max(70,n.x+n.dx/len*m));n.y=Math.min(H-26,Math.max(34,n.y+n.dy/len*m))}
 }
 const col={inv:"#2a9bff",co:"#ff9f0a",sec:"#30d158"},mx=Math.max(...nodes.map(n=>n.size)),mxe=Math.max(...edges.map(e=>e.v));
 let focus=null;const el=document.createElement("div");
 const paint=()=>{const nb=new Set([focus]);if(focus!=null)edges.forEach(e=>{if(e.a===focus)nb.add(e.b);if(e.b===focus)nb.add(e.a)});
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}">`+edges.map(e=>{const a=nodes[e.a],b=nodes[e.b],on=focus==null||e.a===focus||e.b===focus;return`<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}" stroke="#8e8e93" stroke-opacity="${on?.4:.06}" stroke-width="${.6+e.v/mxe*4}"/>`}).join("")+
  nodes.map((n,i)=>{const on=focus==null||nb.has(i),r=5+Math.sqrt(n.size/mx)*11;return`<g data-i="${i}" style="cursor:pointer" opacity="${on?1:.2}"><circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${r.toFixed(1)}" fill="${col[n.kind]}" stroke="#000" stroke-width="2"/><text x="${n.x.toFixed(1)}" y="${(n.y-r-4).toFixed(1)}" fill="#f5f5f7" font-size="11" font-weight="600" text-anchor="middle">${esc(n.label)}</text><title>${esc(n.label)}: ${usd(n.size)}</title></g>`}).join("")+"</svg>";
  el.querySelectorAll("g[data-i]").forEach(g=>g.onclick=()=>{const i=+g.dataset.i;focus=focus===i?null:i;paint()})};
 paint();
 const key=`<div class="sub" style="display:flex;gap:14px;margin-bottom:6px"><span><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${col.inv};margin-right:5px"></i>Investor</span><span><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${col.co};margin-right:5px"></i>Company</span><span><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${col.sec};margin-right:5px"></i>Sector</span></div>`;
 const wrap=document.createElement("div");wrap.innerHTML=key;wrap.appendChild(el);
 return{title:"Network of the most linked firms",sub:"Only the 30 most linked firms, flat and labelled. Click a node to highlight its neighbours.",body:wrap,note:"Best for: seeing clusters and who sits between groups, without the 3D clutter of every firm."};
}

function draw(){
 drawOpts();
 const v={flow,rank,heat,net}[cur]();
 const st=$("#stage");st.innerHTML=`<div class="bar"><div><h2>${v.title}</h2><div class="sub">${v.sub}</div></div><div class="seg"><button class="on">Default view</button><button id="cons">Constellation</button></div></div>`;
 st.appendChild(v.body);const n=document.createElement("div");n.className="note";n.textContent=v.note;st.appendChild(n);
 $("#cons").onclick=()=>{n.textContent="The 3D constellation of every firm would stay one click away here if you choose to keep it."};
}
draw();
</script>
</body>
</html>
